name: Update trading dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # every hour at :20 during NSE hours (09:15–15:30 IST = 03:45–10:00 UTC), Mon–Fri
    - cron: "20 4-10 * * 1-5"
    # one daily refresh after the close
    - cron: "30 11 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: webapp/requirements.txt
      - run: pip install pandas numpy yfinance
      - run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
